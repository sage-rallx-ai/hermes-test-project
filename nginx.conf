server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  types {
    text/html html;
    text/css css;
    application/javascript js;
    application/json json;
    application/manifest+json webmanifest;
    image/svg+xml svg;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
